# GitHub Workflow: Check Patient Portal
#
# Description:
# Runs the Python and browser checks for the CARLOS patient portal.

name: Check Patient Portal

env:
  FHIR_VALIDATOR_SHA256: 0e53ab1d1a6f1e35f505255c0b8ce10a35fcf27e6e96b503640f784cd07e5ad6
  FHIR_VALIDATOR_VERSION: 6.9.12

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  patient-portal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_DB: carlos_portal
          POSTGRES_PASSWORD: carlos_portal
          POSTGRES_USER: carlos_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carlos_portal -d carlos_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        if: matrix.python-version == '3.12'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install browser test dependencies
        if: matrix.python-version == '3.12'
        run: |
          npm ci
          # Playwright downloads its own pinned Chromium. Avoid allowing the
          # runner's unrelated Chrome apt source to break OS dependency setup.
          { grep -rlZF 'https://dl.google.com/linux/chrome' /etc/apt/sources.list.d \
              || test "$?" -eq 1; } \
            | sudo xargs -0r rm -f
          npx playwright install --with-deps chromium

      - name: Audit dependencies
        run: |
          python -m pip_audit --strict --require-hashes --progress-spinner off -r requirements-runtime.lock
          python -m pip_audit --strict --require-hashes --progress-spinner off -r requirements.lock

      - name: Audit browser dependencies
        if: matrix.python-version == '3.12'
        run: npm audit --audit-level=high

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: >-
          python -m pytest
          --cov=carlos_patient_portal
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Compile Python files
        run: python -m compileall carlos_patient_portal tests

      - name: Cache FHIR validator CLI
        if: matrix.python-version == '3.12'
        id: cache-fhir-validator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fhir-validator/validator_cli.jar
          key: fhir-validator-${{ env.FHIR_VALIDATOR_VERSION }}-${{ env.FHIR_VALIDATOR_SHA256 }}

      - name: Download FHIR validator CLI
        if: matrix.python-version == '3.12' && steps.cache-fhir-validator.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fhir-validator"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/fhir-validator/validator_cli.jar" \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${FHIR_VALIDATOR_VERSION}/validator_cli.jar"

      - name: Verify FHIR validator CLI checksum
        if: matrix.python-version == '3.12'
        run: |
          printf '%s  %s\n' \
            "$FHIR_VALIDATOR_SHA256" \
            "$RUNNER_TEMP/fhir-validator/validator_cli.jar" > "$RUNNER_TEMP/fhir-validator/validator.sha256"
          sha256sum -c "$RUNNER_TEMP/fhir-validator/validator.sha256"

      - name: Cache FHIR package cache
        if: matrix.python-version == '3.12'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-package-cache-r4-4.0.1-validator-${{ env.FHIR_VALIDATOR_VERSION }}

      - name: Validate FHIR examples
        if: matrix.python-version == '3.12'
        run: |
          python tests/fhir_examples.py "$RUNNER_TEMP/fhir-examples"
          java -jar "$RUNNER_TEMP/fhir-validator/validator_cli.jar" \
            "$RUNNER_TEMP/fhir-examples" \
            -version 4.0.1 \
            -tx n/a \
            -level errors \
            -output-style compact

      - name: Run migrations
        env:
          PATIENT_PORTAL_ENVIRONMENT: development
          PATIENT_PORTAL_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: alembic -c alembic.ini upgrade head

      - name: Run PostgreSQL migrations
        if: matrix.python-version == '3.12'
        env:
          PATIENT_PORTAL_ENVIRONMENT: development
          PATIENT_PORTAL_DATABASE_URL: "postgresql+psycopg://carlos_portal:carlos_portal@127.0.0.1:5432/carlos_portal"
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head

      - name: Run PostgreSQL security integration tests
        if: matrix.python-version == '3.12'
        env:
          PORTAL_TEST_POSTGRES_URL: "postgresql+psycopg://carlos_portal:carlos_portal@127.0.0.1:5432/carlos_portal"
        run: python -m pytest -q tests/test_postgresql_integration.py

      - name: Run patient portal Playwright browser checks
        if: matrix.python-version == '3.12'
        env:
          PATIENT_PORTAL_ENVIRONMENT: development
          PATIENT_PORTAL_DATABASE_URL: "sqlite+pysqlite:////tmp/patient-portal-browser.db"
          PATIENT_PORTAL_IDENTITY_PROOF_SECRET: "ci-identity-proof-secret-0000000001"
          PATIENT_PORTAL_AUDIT_HASH_SECRET: "ci-audit-hash-secret-00000000000001"
          PATIENT_PORTAL_SESSION_SECRET: "ci-session-secret-playwright-only-000001"
          PATIENT_PORTAL_UNLOCK_SECRET_ENCRYPTION_SECRET: "ci-unlock-secret-key-0000000000001"
          PYTHONPATH: "."
          PORTAL_BASE_URL: "http://127.0.0.1:8090"
          PORTAL_BROWSER_FIXTURE_FILE: "/tmp/patient-portal-browser-fixtures.json"
          PORTAL_USE_DEVELOPMENT_MFA_CODE: "true"
          PORTAL_SCREENSHOT_DIR: "/tmp/patient-portal-playwright"
        run: |
          mkdir -p "$PORTAL_SCREENSHOT_DIR"
          rm -f /tmp/patient-portal-browser.db
          python -m alembic -c alembic.ini upgrade head
          python tests/seed_browser.py
          python -m uvicorn carlos_patient_portal.main:create_app \
            --factory \
            --host 127.0.0.1 \
            --port 8090 > /tmp/patient-portal-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/health >/dev/null && break
            sleep 1
          done
          npm run test:patient-portal-playwright

      - name: Upload Playwright diagnostics
        if: failure() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patient-portal-playwright
          path: |
            /tmp/patient-portal-playwright
            /tmp/patient-portal-uvicorn.log

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: python -m build --wheel --no-isolation

      - name: Validate runtime lock
        if: matrix.python-version == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/patient-portal-runtime"
          . "$RUNNER_TEMP/patient-portal-runtime/bin/activate"
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-deps dist/*.whl
          python -m pip check

      - name: Build production container
        if: matrix.python-version == '3.12'
        run: |
          docker build \
            --build-arg "OCI_REVISION=$GITHUB_SHA" \
            --tag "carlos-patient-portal:$GITHUB_SHA" \
            .
          test "$(docker image inspect --format '{{.Config.User}}' "carlos-patient-portal:$GITHUB_SHA")" = "10001:10001"
          docker run --rm --entrypoint python "carlos-patient-portal:$GITHUB_SHA" \
            -c 'import carlos_patient_portal; print(carlos_patient_portal.__file__)'

      - name: Run production stack smoke test
        if: matrix.python-version == '3.12'
        env:
          PORTAL_IMAGE: carlos-patient-portal:${{ github.sha }}
        run: tests/production_stack_smoke.sh

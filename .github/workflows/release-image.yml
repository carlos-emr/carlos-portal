name: Release Patient Portal Image

on:
  push:
    tags:
      - "v*"

permissions:
  checks: read
  contents: read
  packages: write

concurrency:
  group: release-patient-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$package_version"
          git fetch --no-tags origin main
          release_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo 'Release tags must point to a commit reachable from main.' >&2
            exit 1
          }
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"

      - name: Verify required CI checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checks_file="$RUNNER_TEMP/release-check-runs.json"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/check-runs?filter=latest&per_page=100" \
            > "$checks_file"
          python3 - "$checks_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as check_file:
              check_runs = json.load(check_file)["check_runs"]
          conclusions = {run["name"]: run["conclusion"] for run in check_runs}
          required = {"patient-portal (3.11)", "patient-portal (3.12)"}
          failed = sorted(
              name for name in required if conclusions.get(name) != "success"
          )
          if failed:
              details = ", ".join(
                  f"{name}={conclusions.get(name, 'missing')}" for name in failed
              )
              raise SystemExit(f"Required CI checks have not passed: {details}")
          PY

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish immutable release
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if docker manifest inspect "$image_repository:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag $image_repository:$RELEASE_TAG" >&2
            exit 1
          fi
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          metadata_file="$RUNNER_TEMP/portal-image-metadata.json"
          docker buildx create --driver docker-container --name portal-release-builder --use
          docker buildx build \
            --build-arg "OCI_CREATED=$created" \
            --build-arg "OCI_REVISION=$RELEASE_COMMIT" \
            --build-arg "OCI_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg "OCI_VERSION=$RELEASE_TAG" \
            --metadata-file "$metadata_file" \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --tag "$image_repository:$RELEASE_TAG" \
            --push \
            .
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$metadata_file")
          digest_reference="$image_repository@$digest"
          echo "digest-reference=$digest_reference" >> "$GITHUB_OUTPUT"

      - name: Record deployment reference
        env:
          DIGEST_REFERENCE: ${{ steps.image.outputs.digest-reference }}
        run: |
          {
            echo '### Patient portal image'
            echo
            echo "Deploy this immutable image: \`$DIGEST_REFERENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"
